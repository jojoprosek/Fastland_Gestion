<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fastlane Gestion</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<meta name="theme-color" content="#0b2f6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fastlane">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon-192.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=fl6">
</head>
<body>
<div class="sage">
  <header class="titlebar">
    <img class="tb-logo" src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Fastlane Logistic">
    <span id="wint">Fastlane Gestion — Exercice 2026</span>
    <span id="offbar" class="offpill" hidden>Hors ligne</span>
  </header>
  <div class="brand-stripe" aria-hidden="true"></div>
  <nav class="menubar" aria-label="Menu">
    <button type="button" data-a="menu" data-v="Fichier" accesskey="f">Fichier</button>
    <button type="button" data-a="menu" data-v="Edition" accesskey="e">Edition</button>
    <button type="button" data-a="menu" data-v="Structure" accesskey="s">Structure</button>
    <button type="button" data-a="menu" data-v="Traitement" accesskey="t">Traitement</button>
    <button type="button" data-a="menu" data-v="Etat" accesskey="a">État</button>
    <button type="button" data-a="menu" data-v="Fenêtre" accesskey="n">Fenêtre</button>
    <button type="button" data-a="help" title="Aide (F1)">?</button>
  </nav>
  <div id="dd" class="dd" hidden></div>
  <div class="toolbar" role="toolbar">
    <div class="tg">
      <button type="button" data-a="add" title="Ajouter (Ctrl+N)">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>Ajouter</span>
      </button>
      <button type="button" data-a="go" data-v="sales" title="Consulter">
        <svg viewBox="0 0 24 24"><path d="M8 4h7l5 5v11H8z"/><path d="M15 4v5h5"/><circle cx="12" cy="14" r="2.4"/><path d="M13.8 15.8 16 18"/></svg>
        <span>Consulter</span>
      </button>
      <button type="button" data-a="go" data-v="acc" data-t="Saisie" title="Saisie">
        <svg viewBox="0 0 24 24"><path d="M6 4h9l5 5v11H6z"/><path d="M15 4v5h5"/><path d="M9 13h4M9 16h6"/></svg>
        <span>Saisie</span>
      </button>
      <button type="button" data-a="go" data-v="etats" data-t="Bilan" title="États">
        <svg viewBox="0 0 24 24"><path d="M5 19V9h4v10H5zm5 0V5h4v14h-4zm5 0v-7h4v7h-4z"/></svg>
        <span>États</span>
      </button>
    </div>
    <i></i>
    <div class="tg">
      <button type="button" data-a="go" data-v="home" title="Accueil">
        <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20H14v-6H10v6H4z"/></svg>
        <span>Accueil</span>
      </button>
      <button type="button" data-a="go" data-v="dash" title="Indicateurs">
        <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM4 13h7v7H4zM13 10h7v11h-7z"/></svg>
        <span>Indicateurs</span>
      </button>
    </div>
    <i></i>
    <div class="tg">
      <button type="button" data-a="focusq" title="Rechercher">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
        <span>Rechercher</span>
      </button>
      <button type="button" data-a="pr" title="Imprimer (Ctrl+P)">
        <svg viewBox="0 0 24 24"><path d="M7 8V3h10v5"/><path d="M7 17H5a2 2 0 0 1-2-2v-5h18v5a2 2 0 0 1-2 2h-2"/><path d="M7 13h10v8H7z"/></svg>
        <span>Imprimer</span>
      </button>
      <button type="button" data-a="sv" title="Enregistrer (Ctrl+S)">
        <svg viewBox="0 0 24 24"><path d="M5 3h11l5 5v13H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>
        <span>Enregistrer</span>
      </button>
    </div>
    <span class="sp"></span>
    <label class="tsearch">
      <input id="q" type="search" placeholder="Atteindre un compte, un tiers…" aria-label="Rechercher">
    </label>
    <button type="button" class="tth" data-a="th" aria-label="Changer de thème" title="Thème">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Thème</span>
    </button>
    <button type="button" class="who" id="who" data-a="out" title="Changer d’utilisateur">Session</button>
  </div>
  <div class="app">
    <aside>
      <nav id="snav"></nav>
    </aside>
    <main>
      <div class="top" id="modbar">
        <div class="crumb"><h1 id="ti">Accueil</h1><p id="sub">Fastlane Gestion</p></div>
      </div>
      <div id="v"></div>
    </main>
  </div>
</div>
<div id="m"></div><div id="t" role="status"></div>
<div id="login" class="login" hidden></div>
<script src="{{ url_for('static', filename='js/app.js') }}?v=fl6"></script>
<script src="{{ url_for('static', filename='js/pwa.js') }}?v=fl6"></script>
<script src="{{ url_for('static', filename='js/erp.js') }}?v=fl6"></script>
</body>
</html>
